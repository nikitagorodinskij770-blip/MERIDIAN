<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Политика безопасности контента. Дублирует заголовок сервера: если сайт
       поднят статикой без нашего сервера, защита всё равно действует.
       connect-src — закрытый список бирж: любой другой адрес браузер отсечёт,
       даже если внедрённый скрипт попытается туда обратиться. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    img-src 'self' data:;
    font-src 'self' https://fonts.gstatic.com data:;
    connect-src 'self'
      https://elokoleohntufgrkyvxm.supabase.co wss://elokoleohntufgrkyvxm.supabase.co
      https://api.binance.com wss://stream.binance.com:9443
      https://api.coinbase.com https://api.exchange.coinbase.com
      https://api.coingecko.com https://www.okx.com
      https://api.bybit.com https://api.kraken.com https://www.bitstamp.net;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self';
    object-src 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>MERIDIAN — Digital Asset Exchange</title>
  <meta name="description" content="MERIDIAN — институциональный обменник цифровых активов. Спот-торговля, обмен, кошелёк, аналитика." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Дисплейная антиква: заголовки и логотип. Текст интерфейса и цифры
       остаются на гротеске и моноширинном — засечки в плотных таблицах
       читаются хуже. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" />

  <!-- Тема выставляется до отрисовки: иначе тёмная страница успевает
       мигнуть светлой. Обычный (не module) скрипт — он блокирующий. -->
  <script src="js/theme-boot.js"></script>

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/surface.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>
  <!-- Безграничная фоновая среда: фиксирована, не прокручивается вместе с контентом -->
  <div class="bg-field" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>


  <!-- Шапка -->
  <header id="site-header" class="site-header"></header>

  <!-- Основной контент (роутер) -->
  <main id="app" class="app-main"></main>

  <!-- Подвал -->
  <footer id="site-footer" class="site-footer"></footer>

  <!-- Нижняя мобильная навигация -->
  <nav id="mobile-tabbar" class="mobile-tabbar"></nav>

  <!-- Слои: тосты и модалки -->
  <div id="toast-layer" class="toast-layer"></div>
  <div id="modal-layer" class="modal-layer" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
